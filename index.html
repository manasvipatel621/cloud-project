<html>
<head>
<title>ICU Monitoring</title>
<style>
body { font-family: Arial; text-align:center; background:#f2f2f2; }
h1 { color:#d32f2f; }
.card {
  background:white;
  padding:20px;
  margin:20px auto;
  width:300px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}
.critical { color:red; font-weight:bold; }
.stable { color:green; font-weight:bold; }
</style>
</head>

<body>

<h1>ICU Patient Monitoring System</h1>

<div class="card">
<h2>Patient: Rajesh Kumar</h2>
<p>Heart Rate: 130 bpm</p>
<p>Oxygen: 88%</p>
<p class="critical">Status: CRITICAL</p>
</div>

<div class="card">
<h2>Patient: Sunita Rao</h2>
<p>Heart Rate: 95 bpm</p>
<p>Oxygen: 97%</p>
<p class="stable">Status: STABLE</p>
</div>

</body>
</html>
